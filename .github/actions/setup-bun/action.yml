name: "Setup Bun"
description: "Setup Bun with caching and install dependencies"
inputs:
  install-flags:
    description: "Additional flags to pass to 'bun install'"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "24"

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json

    - name: Get cache directory
      id: cache
      shell: bash
      run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"

    - name: Restore Bun dependencies
      id: bun-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies (with retry)
      run: |
        MAX_RETRIES=3
        RETRY_DELAY=5
        for i in $(seq 1 $MAX_RETRIES); do
          echo "=== Install attempt $i/$MAX_RETRIES ==="
          if [ $i -gt 1 ]; then
            echo "Cleaning cache..."
            rm -rf node_modules/.bun node_modules
            bun pm cache rm || true
          fi
          INSTALL_CMD="bun install --frozen-lockfile ${{ inputs.install-flags }}"
          if [ "$i" = "$MAX_RETRIES" ]; then
            echo "Last attempt: allowing lockfile updates..."
            INSTALL_CMD="bun install ${{ inputs.install-flags }}"
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            $INSTALL_CMD --linker hoisted && break
          else
            $INSTALL_CMD && break
          fi
          if [ $i -lt $MAX_RETRIES ]; then
            echo "Install failed, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          else
            echo "ERROR: bun install failed after $MAX_RETRIES attempts"
            exit 1
          fi
        done
        echo "✅ Dependencies installed successfully"
      shell: bash

    - name: Save Bun dependencies
      if: steps.bun-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
