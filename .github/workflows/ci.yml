name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  typecheck:
    # 只在 macOS 构建（Apple Silicon）
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Typecheck
        run: bun run script/dedupe-keymap.ts && bun run typecheck

  test:
    # 只在 macOS 运行测试
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Run tests
        run: bun run --cwd packages/core test && bun run --cwd packages/llm test && bun run --cwd packages/server test
