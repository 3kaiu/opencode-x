name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Typecheck
        run: bun run --cwd packages/core typecheck && bun run --cwd packages/opencode typecheck

      - name: Build macOS Apple Silicon CLI
        run: |
          OPENCODE_CHANNEL=latest OPENCODE_VERSION="${GITHUB_REF_NAME#v}" bun run --cwd packages/opencode script/build.ts --skip-embed-web-ui --skip-install

      - name: Package Assets
        run: |
          mkdir -p release-assets
          cd packages/opencode/dist/opencode-darwin-arm64/bin
          tar czf "../../../../../release-assets/opencode-darwin-arm64.tar.gz" ocx
          cd -
          cp script/install.sh release-assets/
          ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            release-assets/opencode-darwin-arm64.tar.gz
            release-assets/install.sh
          fail_on_unmatched_files: true